[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-scorecard"
version = "1.0.0"
description = "End-to-end retail credit risk (probability of default) scorecard pipeline on synthetic data, with a rigorous validation report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adham Karim" }]
keywords = ["credit risk", "scorecard", "weight of evidence", "probability of default", "IFRS 9", "model validation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
dev = ["pytest>=7", "ruff>=0.4", "scikit-learn>=1.3"]

[project.scripts]
credit-scorecard = "credit_scorecard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
